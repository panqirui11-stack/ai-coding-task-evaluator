[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-coding-task-evaluator"
version = "0.1.0"
description = "A deterministic evaluator for AI coding training tasks."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
ai-task-eval = "ai_task_evaluator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
